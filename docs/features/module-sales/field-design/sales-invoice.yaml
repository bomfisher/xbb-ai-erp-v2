businessCode: SALES_INVOICE
fields:
  - { name: invoiceNo, attr: main.invoiceNo, attrName: 销售发票编号, fieldType: SERIAL_NO, scenes: [LIST, CREATE, UPDATE], required: true, editable: false, defaultValue: null, filterName: null }
  - { name: invoiceSource, attr: sourceSelection, attrName: 开票来源, fieldType: INVOICE_SOURCE, scenes: [CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: null }
  - { name: customerId, attr: main.customerId, attrName: 客户, fieldType: BUSINESS, scenes: [LIST, CREATE, UPDATE], required: true, editable: true, defaultValue: null, filterName: null, businessCode: CUSTOMER }
  - { name: invoiceDate, attr: main.invoiceDate, attrName: 发票日期, fieldType: DATE, scenes: [LIST, CREATE, UPDATE], required: true, editable: true, defaultValue: null, filterName: invoice_date }
  - { name: dueDate, attr: main.dueDate, attrName: 应收到期日, fieldType: DATE, scenes: [LIST, CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: due_date }
  - { name: paymentTerm, attr: main.paymentTerm, attrName: 付款条件, fieldType: TEXT, scenes: [LIST, CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: payment_term }
  - { name: untaxedAmount, attr: main.untaxedAmount, attrName: 未税金额, fieldType: AMOUNT, scenes: [LIST, CREATE, UPDATE], required: false, editable: false, defaultValue: null, filterName: untaxed_amount }
  - { name: taxAmount, attr: main.taxAmount, attrName: 税额, fieldType: AMOUNT, scenes: [LIST, CREATE, UPDATE], required: false, editable: false, defaultValue: null, filterName: tax_amount }
  - { name: amount, attr: main.amount, attrName: 含税总金额, fieldType: AMOUNT, scenes: [LIST, CREATE, UPDATE], required: false, editable: false, defaultValue: null, filterName: amount }
  - { name: invoiceType, attr: main.invoiceType, attrName: 发票类型, fieldType: COMB, scenes: [LIST, CREATE, UPDATE], required: true, editable: false, defaultValue: SALE, filterName: invoice_type, options: 'SALE:销售发票,CREDIT_NOTE:贷项发票' }
  - { name: status, attr: main.status, attrName: 状态, fieldType: COMB, scenes: [LIST], required: true, editable: false, defaultValue: DRAFT, filterName: status, options: 'DRAFT:草稿,POSTED:已过账,VOIDED:已作废' }
  - { name: auditStatus, attr: main.auditStatus, attrName: 审核状态, fieldType: COMB, scenes: [LIST], required: true, editable: false, defaultValue: 0, filterName: audit_status, options: '0:待审核,1:审核中,2:已审核,3:已拒绝' }
  - { name: auditTime, attr: main.auditTime, attrName: 审核时间, fieldType: DATE, scenes: [LIST, UPDATE], required: false, editable: false, defaultValue: null, filterName: audit_time }
  - { name: postedTime, attr: main.postedTime, attrName: 过账时间, fieldType: DATE, scenes: [LIST, UPDATE], required: false, editable: false, defaultValue: null, filterName: posted_time }
  - { name: remark, attr: main.remark, attrName: 备注, fieldType: TEXT, scenes: [LIST, CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: null }
  - name: invoiceLines
    attr: lines
    attrName: 发票明细
    fieldType: SUB_ITEM
    scenes: [CREATE, UPDATE]
    required: true
    editable: true
    defaultValue: null
    filterName: null
    subFields:
      - { name: productId, attr: productId, attrName: 商品或服务, fieldType: PRODUCT, scenes: [CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: null, businessCode: PRODUCT_SKU }
      - { name: productName, attr: productName, attrName: 商品或服务名称, fieldType: TEXT, scenes: [CREATE, UPDATE], required: true, editable: true, defaultValue: null, filterName: null }
      - { name: specification, attr: specification, attrName: 规格型号, fieldType: TEXT, scenes: [CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: null }
      - { name: unitId, attr: unitId, attrName: 单位, fieldType: BUSINESS, scenes: [CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: null, businessCode: PRODUCT_SPU }
      - { name: quantity, attr: quantity, attrName: 数量, fieldType: NUM_DOUBLE, scenes: [CREATE, UPDATE], required: true, editable: true, defaultValue: null, filterName: null }
      - { name: unitPrice, attr: unitPrice, attrName: 未税单价, fieldType: AMOUNT, scenes: [CREATE, UPDATE], required: true, editable: true, defaultValue: null, filterName: null }
      - { name: taxRate, attr: taxRate, attrName: 税率, fieldType: NUM_DOUBLE, scenes: [CREATE, UPDATE], required: true, editable: true, defaultValue: 0, filterName: null }
      - { name: untaxedAmount, attr: untaxedAmount, attrName: 未税金额, fieldType: AMOUNT, scenes: [CREATE, UPDATE], required: false, editable: false, defaultValue: null, filterName: null }
      - { name: taxAmount, attr: taxAmount, attrName: 税额, fieldType: AMOUNT, scenes: [CREATE, UPDATE], required: false, editable: false, defaultValue: null, filterName: null }
      - { name: amount, attr: amount, attrName: 含税金额, fieldType: AMOUNT, scenes: [CREATE, UPDATE], required: false, editable: false, defaultValue: null, filterName: null }
      - { name: remark, attr: remark, attrName: 备注, fieldType: TEXT, scenes: [CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: null }
formSections:
  - { key: basic, title: 基本信息, order: 10, fields: [main.invoiceNo, main.customerId, main.invoiceDate, main.dueDate, main.paymentTerm, main.invoiceType, main.remark] }
  - { key: source, title: 开票来源, order: 20, fields: [sourceSelection] }
  - { key: lines, title: 发票明细, order: 30, fields: [lines] }
  - { key: amount, title: 金额汇总, order: 40, fields: [main.untaxedAmount, main.taxAmount, main.amount] }
listActions:
  top: [{ actionCode: ADD, actionName: 新建 }, { actionCode: AUDIT, actionName: 审核/反审核 }]
  bottom: []
  row:
    - { actionCode: EDIT, actionName: 编辑 }
    - { actionCode: POST, actionName: 过账 }
    - { actionCode: RED_FLUSH, actionName: 红冲 }
    - { actionCode: VOID, actionName: 作废 }
