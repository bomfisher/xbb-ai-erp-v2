<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP 字段设计器</title>
  <style>
    :root { --primary:#7c3aed; --primary-soft:#f3e8ff; --bg:#faf5ff; --surface:#fff; --text:#0f172a; --muted:#64748b; --border:#e9d5ff; --danger:#b91c1c; --success:#166534; --radius:14px; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--text); background:linear-gradient(135deg,#faf5ff 0,#f8fafc 55%,#f5f3ff 100%); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    button,input,textarea { font:inherit; } button { cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid rgba(124,58,237,.32); outline-offset:2px; }
    .shell { max-width:1540px; margin:0 auto; padding:32px 24px 48px; }
    header { display:flex; gap:20px; justify-content:space-between; align-items:flex-start; margin-bottom:24px; }
    h1 { margin:0; font-size:26px; letter-spacing:-.03em; } h1 span { color:var(--primary); }
    .subtitle { margin:7px 0 0; color:var(--muted); } .offline { flex:none; color:var(--success); background:#f0fdf4; border:1px solid #bbf7d0; border-radius:99px; padding:6px 10px; font-size:12px; }
    .card { background:rgba(255,255,255,.92); border:1px solid var(--border); box-shadow:0 12px 34px rgba(76,29,149,.07); border-radius:var(--radius); padding:20px; }
    .source-grid { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:18px; align-items:end; }
    label { display:block; color:#334155; font-weight:650; margin-bottom:7px; } .hint { color:var(--muted); font-size:12px; font-weight:400; margin-left:5px; }
    textarea,input[type="text"] { width:100%; border:1px solid #cbd5e1; border-radius:8px; color:var(--text); background:#fff; padding:9px 10px; transition:border-color .16s,box-shadow .16s; }
    textarea { min-height:160px; resize:vertical; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; } textarea:focus,input[type="text"]:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(124,58,237,.11); outline:0; }
    .side-controls { display:grid; gap:12px; } .button { border:1px solid transparent; border-radius:8px; min-height:40px; padding:8px 13px; font-weight:700; background:#fff; color:#334155; border-color:#cbd5e1; transition:transform .16s,background .16s,border-color .16s; }
    .button:hover { border-color:#a78bfa; background:#faf5ff; } .button:active { transform:translateY(1px); } .button.primary { color:#fff; background:var(--primary); border-color:var(--primary); } .button.primary:hover { background:#6d28d9; }
    .button.danger { color:var(--danger); } .button.small { min-height:32px; padding:5px 9px; font-size:12px; } .button:disabled { opacity:.5; cursor:not-allowed; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:28px 0 12px; } h2 { margin:0; font-size:18px; } .count { color:var(--primary); background:var(--primary-soft); border-radius:99px; padding:2px 8px; font-size:12px; }
    .notice { color:var(--muted); font-size:12px; margin:0; } #fieldList { display:grid; gap:12px; }
    .empty { padding:34px; text-align:center; color:var(--muted); border:1px dashed #c4b5fd; border-radius:var(--radius); background:#fff; }
    .field { border:1px solid #ddd6fe; border-radius:11px; overflow:hidden; background:#fff; } .field.disabled { opacity:.55; background:#fafafa; }
    .field-top { display:grid; grid-template-columns:31px minmax(140px,.9fr) minmax(150px,1fr) minmax(130px,.9fr) auto; gap:12px; align-items:center; padding:13px 14px; background:#fcfbff; border-bottom:1px solid #ede9fe; }
    .field-name { font:600 13px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; } .db-type { color:var(--muted); font-size:11px; margin-top:2px; }
    .enable { width:18px; height:18px; accent-color:var(--primary); } .mini-label { display:block; font-size:11px; color:var(--muted); font-weight:600; margin:0 0 3px; }
    .field input[type="text"] { padding:6px 8px; min-height:32px; } .field-actions { display:flex; gap:7px; align-items:center; }
    .field-body { padding:13px 14px 15px; display:grid; grid-template-columns:260px minmax(530px,1fr) minmax(200px,.75fr); gap:16px; align-items:start; }
    .check-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px 10px; padding-top:3px; } .check-grid label,.type-option { display:flex; align-items:center; gap:6px; margin:0; font-size:12px; font-weight:600; cursor:pointer; }
    input[type="checkbox"],input[type="radio"] { accent-color:var(--primary); width:15px; height:15px; flex:none; }
    .type-group { display:flex; flex-wrap:wrap; gap:6px; border:0; padding:0; margin:0; } .type-option { border:1px solid #ddd6fe; border-radius:7px; padding:4px 6px; color:#475569; }
    .type-option:has(input:checked) { color:#5b21b6; border-color:#a78bfa; background:#f5f3ff; } .type-option input { width:13px; height:13px; }
    .extra { display:none; } .extra.visible { display:block; } .extra label { font-size:12px; } .extra .hint { display:block; margin:3px 0 0; }
    .sub-fields { margin:0 14px 14px; padding:14px; border:1px solid #ddd6fe; border-radius:10px; background:#faf5ff; } .sub-fields-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; } .sub-fields-title { margin:0; font-size:13px; } .sub-fields-hint { color:var(--muted); font-size:12px; }
    .sub-field-list { display:grid; gap:8px; } .sub-field { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; align-items:end; padding:12px; border:1px solid #e9d5ff; border-radius:8px; background:#fff; } .sub-field label { margin:0; font-size:11px; } .sub-field .check-grid { grid-column:1 / 3; display:flex; flex-wrap:wrap; gap:7px 14px; padding:0; } .sub-field .check-grid label { font-size:11px; } .sub-field .field-actions { grid-column:3; justify-self:end; align-self:center; }
    .sub-field .type-group,.sub-field .extra { grid-column:1 / -1; } .sub-field .type-group { gap:4px; } .sub-field .type-option { padding:3px 5px; font-size:11px; } .sub-field .extra { max-width:460px; } .bottom-add { display:flex; justify-content:center; padding-top:4px; }
    .output { margin-top:28px; } .output-bar { display:flex; align-items:end; justify-content:space-between; gap:14px; margin-bottom:11px; } .business-code { width:210px; } .business-code input { text-transform:uppercase; }
    #yamlOutput { min-height:260px; background:#111827; color:#e5e7eb; border-color:#111827; } .status { min-height:20px; margin:10px 0 0; color:var(--muted); font-size:13px; } .status.error { color:var(--danger); } .status.success { color:var(--success); }
    .footer-actions { display:flex; flex-wrap:wrap; gap:9px; } @media (max-width:1050px) { .field-body { grid-template-columns:1fr; } .source-grid { grid-template-columns:1fr; } .side-controls { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:720px) { .shell { padding:20px 12px 32px; } header { display:block; } .offline { display:inline-block; margin-top:12px; } .field-top { grid-template-columns:27px 1fr auto; } .field-top .attr-box,.field-top .name-box { grid-column:2/-1; } .check-grid { grid-template-columns:repeat(2,1fr); } .sub-field { grid-template-columns:1fr; } .sub-field .check-grid,.sub-field .field-actions,.sub-field .type-group,.sub-field .extra { grid-column:1; } .sub-field .field-actions { justify-self:start; } .output-bar { display:block; } .business-code { width:100%; margin-bottom:12px; } }
    @media (prefers-reduced-motion:reduce) { *,*:before,*:after { transition:none!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><h1>ERP <span>字段设计器</span></h1><p class="subtitle">粘贴建表 SQL，确认字段页面属性，生成可直接交给业务模块交付 Skill 的字段设计 YAML。</p></div><div class="offline">纯离线运行 · 无外部依赖</div></header>
    <section class="card" aria-labelledby="sourceTitle">
      <div class="source-grid"><div><label id="sourceTitle" for="sqlInput">建表 SQL <span class="hint">支持 MySQL CREATE TABLE，自动跳过基础字段与索引约束</span></label><textarea id="sqlInput" spellcheck="false" placeholder="CREATE TABLE `demo` (\n  `name` varchar(64) NOT NULL COMMENT '名称',\n  `status` tinyint NOT NULL COMMENT '状态'\n);"></textarea></div><div class="side-controls"><button class="button primary" id="parseButton" type="button">解析字段</button><button class="button" id="addButton" type="button">手动新增字段</button><p class="notice">过滤：id、corpid、del、add_time、update_time</p></div></div>
    </section>
    <div class="section-head"><div><h2>字段配置 <span class="count" id="fieldCount">0</span></h2><p class="notice">关闭“启用”的字段不会写入 YAML；不可筛选类型切换后会自动关闭“可筛选”。</p></div></div>
    <section id="fieldList" aria-live="polite"><div class="empty">请先粘贴 SQL 并点击“解析字段”，或手动新增字段。</div></section>
    <div class="bottom-add"><button class="button" id="bottomAddButton" type="button">新增字段</button></div>
    <section class="card output" aria-labelledby="outputTitle"><div class="output-bar"><div class="business-code"><label for="businessCode">业务编码 <span class="hint">BusinessCodeEnum 值</span></label><input id="businessCode" type="text" value="DEMO" maxlength="64" placeholder="例如 SALES_ORDER"></div><div class="footer-actions"><button class="button primary" id="generateButton" type="button">生成 YAML</button><button class="button" id="copyButton" type="button">复制 YAML</button><button class="button" id="downloadButton" type="button">下载 YAML</button></div></div><label id="outputTitle" for="yamlOutput">字段设计 YAML</label><textarea id="yamlOutput" spellcheck="false" readonly placeholder="生成结果会显示在这里。"></textarea><p id="status" class="status" role="status"></p></section>
  </main>
  <script>
    (() => {
      const FILTERABLE = new Set(['TEXT','USER','DEPT','COMB','NUM_INT','NUM_DOUBLE','AMOUNT','DATE','TIME']);
      const NON_FILTERABLE = new Set(['FILE','IMAGE','ADDRESS','SUB_ITEM','PRODUCT','COMB_MULTI','CHECKBOX','RADIO_BTN','USER_MULTI','DEPT_MULTI','BUSINESS']);
      const TYPES = ['TEXT','NUM_INT','NUM_DOUBLE','AMOUNT','DATE','TIME','COMB','COMB_MULTI','CHECKBOX','RADIO_BTN','USER','USER_MULTI','DEPT','DEPT_MULTI','BUSINESS','FILE','IMAGE','ADDRESS','SUB_ITEM','PRODUCT'];
      const OPTION_TYPES = new Set(['COMB','COMB_MULTI','CHECKBOX','RADIO_BTN']);
      const IGNORED = new Set(['id','corpid','del','add_time','update_time']);
      let fields = [];
      const $ = (selector) => document.querySelector(selector);
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const camelCase = (name) => name.toLowerCase().replace(/_+([a-z0-9])/g, (_, character) => character.toUpperCase());
      const escapeYaml = (value) => { const text = String(value ?? ''); return /^[A-Za-z0-9_./-]+$/.test(text) ? text : JSON.stringify(text); };
      const setStatus = (message, type = '') => { const node = $('#status'); node.textContent = message; node.className = `status ${type}`; };
      const inferType = (name, dbType) => {
        const lower = name.toLowerCase(); const type = dbType.toLowerCase();
        if (['user_id','create_id','creator_id','modify_id','modifier_id'].includes(lower)) return 'USER';
        if (lower === 'dep_id') return 'DEPT';
        if (lower.includes('image')) return 'IMAGE'; if (lower.includes('file')) return 'FILE';
        if (lower.includes('data_id')) return 'BUSINESS';
        if (lower.includes('time') || lower.includes('date')) return 'DATE';
        if (type.startsWith('tinyint')) return 'COMB'; if (/^(int|integer|bigint|smallint|mediumint)/.test(type)) return 'NUM_INT';
        if (/^(double|decimal|float|numeric|real)/.test(type)) return 'NUM_DOUBLE'; return 'TEXT';
      };
      const defaultField = (name = 'new_field', dbType = 'varchar(255)', comment = '', isChild = false) => { const fieldType = inferType(name, dbType); return { id: cryptoId(), enabled:true, name, dbType, attr:isChild ? camelCase(name) : `main.${camelCase(name)}`, attrName:comment || name, scenes:isChild ? ['CREATE','UPDATE'] : ['LIST','CREATE','UPDATE'], required:false, editable:true, filterable:!isChild && FILTERABLE.has(fieldType), fieldType, extra:'', subFields:[] }; };
      const cryptoId = () => `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
      const splitColumns = (source) => { const parts=[]; let start=0, depth=0, quote=''; for(let index=0; index<source.length; index++){ const char=source[index]; if(quote){ if(char===quote && source[index-1] !== '\\') quote=''; continue; } if(char==='\'' || char==='"' || char==='`'){ quote=char; continue; } if(char==='(') depth++; else if(char===')') depth=Math.max(0,depth-1); else if(char===',' && depth===0){ parts.push(source.slice(start,index)); start=index+1; } } parts.push(source.slice(start)); return parts; };
      const parseSql = () => {
        const sql = $('#sqlInput').value.replace(/\/\*[\s\S]*?\*\//g,' ').replace(/--[^\n]*/g,' ');
        const opening = sql.indexOf('('); const closing = sql.lastIndexOf(')');
        if(opening < 0 || closing <= opening) { setStatus('没有识别到完整的 CREATE TABLE 字段区，请检查 SQL。','error'); return; }
        const parsed = [];
        splitColumns(sql.slice(opening + 1, closing)).forEach(line => {
          const normalized=line.trim(); if(!normalized || /^(PRIMARY\s+KEY|UNIQUE(?:\s+KEY|\s+INDEX)?|KEY|INDEX|CONSTRAINT|FOREIGN\s+KEY|CHECK)\b/i.test(normalized)) return;
          const match=normalized.match(/^`?([A-Za-z_][A-Za-z0-9_]*)`?\s+([A-Za-z]+(?:\s*\([^)]*\))?)/);
          if(!match || IGNORED.has(match[1].toLowerCase())) return;
          const commentMatch=normalized.match(/\bCOMMENT\s+(?:'((?:\\'|[^'])*)'|"((?:\\"|[^"])*)")/i);
          const comment=(commentMatch?.[1] ?? commentMatch?.[2] ?? '').replace(/\\(['"])/g,'$1'); parsed.push(defaultField(match[1],match[2],comment));
        });
        if(!parsed.length) { setStatus('未解析到可用字段；请确认字段以“字段名 类型”形式定义。','error'); return; }
        fields=parsed; render(); setStatus(`已解析 ${fields.length} 个字段，基础字段和索引已自动跳过。`,'success');
      };
      const render = () => { const container=$('#fieldList'); $('#fieldCount').textContent=fields.length; if(!fields.length){ container.innerHTML='<div class="empty">请先粘贴 SQL 并点击“解析字段”，或手动新增字段。</div>'; return; } container.innerHTML=fields.map((field,index) => fieldHtml(field,index)).join(''); bindFieldEvents(); };
      const extraHtml = (field) => { const isOption=OPTION_TYPES.has(field.fieldType); const show=isOption || field.fieldType==='BUSINESS'; const label=isOption ? '选项值' : '上游业务编码'; const hint=isOption ? '例如：0:禁用, 1:启用' : '填写被依赖业务的 businessCode，例如 PRODUCT'; return `<div class="extra ${show?'visible':''}"><label><span class="extra-label">${label}</span><input data-key="extra" type="text" value="${escapeHtml(field.extra)}" placeholder="${escapeHtml(hint)}"><span class="hint">${escapeHtml(hint)}</span></label></div>`; };
      const sceneChecks = (field, child = false) => `<div class="check-grid"><label><input data-key="scene-LIST" type="checkbox" ${field.scenes.includes('LIST')?'checked':''} ${child?'disabled':''}>列表</label><label><input data-key="scene-CREATE" type="checkbox" ${field.scenes.includes('CREATE')?'checked':''}>新建</label><label><input data-key="scene-UPDATE" type="checkbox" ${field.scenes.includes('UPDATE')?'checked':''}>编辑</label><label><input data-key="required" type="checkbox" ${field.required?'checked':''}>必填</label><label><input data-key="editable" type="checkbox" ${field.editable?'checked':''}>可编辑</label>${child ? '' : `<label><input data-key="filterable" type="checkbox" ${field.filterable?'checked':''} ${NON_FILTERABLE.has(field.fieldType)?'disabled':''}>可筛选</label>`}</div>`;
      const typeOptions = (field, child = false) => `<fieldset class="type-group" aria-label="${escapeHtml(field.name)} 字段类型">${TYPES.filter(type=>!child || type!=='SUB_ITEM').map(type=>`<label class="type-option"><input data-key="fieldType" type="radio" name="type-${field.id}" value="${type}" ${field.fieldType===type?'checked':''}>${type}</label>`).join('')}</fieldset>`;
      const childHtml = (field,parentIndex,childIndex) => `<div class="sub-field" data-parent-index="${parentIndex}" data-child-index="${childIndex}"><label>字段名 name<input data-key="name" type="text" value="${escapeHtml(field.name)}"></label><label>提交路径 attr<input data-key="attr" type="text" value="${escapeHtml(field.attr)}"></label><label>展示名称 attrName<input data-key="attrName" type="text" value="${escapeHtml(field.attrName)}"></label><div>${sceneChecks(field,true)}</div><div class="field-actions"><button class="button small danger" data-action="remove-child" type="button">删除</button></div><div>${typeOptions(field,true)}</div>${extraHtml(field)}</div>`;
      const subFieldsHtml = (field,index) => field.fieldType !== 'SUB_ITEM' ? '' : `<section class="sub-fields"><div class="sub-fields-head"><div><h3 class="sub-fields-title">子档字段</h3><div class="sub-fields-hint">直属于 ${escapeHtml(field.name)}；子字段不支持筛选。</div></div><button class="button small" data-action="add-child" type="button">新增子档字段</button></div><div class="sub-field-list">${field.subFields.map((child,childIndex)=>childHtml(child,index,childIndex)).join('') || '<p class="notice">尚未新增子档字段。</p>'}</div></section>`;
      const fieldHtml = (field,index) => `<article class="field ${field.enabled?'':'disabled'}" data-index="${index}"><div class="field-top"><input class="enable" data-key="enabled" type="checkbox" ${field.enabled?'checked':''} aria-label="启用 ${escapeHtml(field.name)}"><div class="name-box"><span class="mini-label">字段名 name</span><input data-key="name" type="text" value="${escapeHtml(field.name)}"><div class="db-type">${escapeHtml(field.dbType || '手动字段')}</div></div><div class="attr-box"><span class="mini-label">提交路径 attr</span><input data-key="attr" type="text" value="${escapeHtml(field.attr)}"></div><div><span class="mini-label">展示名称 attrName</span><input data-key="attrName" type="text" value="${escapeHtml(field.attrName)}"></div><div class="field-actions"><button class="button small danger" data-action="remove" type="button">删除</button></div></div><div class="field-body">${sceneChecks(field)}${typeOptions(field)}${extraHtml(field)}</div>${subFieldsHtml(field,index)}</article>`;
      const updateField = (field,target,isChild) => { const key=target.dataset.key; if(!key) return false; if(key==='fieldType'){ field.fieldType=target.value; if(!isChild){ field.filterable=FILTERABLE.has(field.fieldType); } render(); return true; } if(key.startsWith('scene-')){ const scene=key.slice(6); field.scenes=target.checked ? [...field.scenes.filter(item=>item!==scene),scene] : field.scenes.filter(item=>item!==scene); return true; } field[key]=target.type==='checkbox' ? target.checked : target.value; return key==='enabled'; };
      const bindFieldEvents = () => { document.querySelectorAll('.field').forEach(node => { node.addEventListener('input', event => { if(event.target.closest('.sub-field')) return; if(updateField(fields[Number(node.dataset.index)],event.target,false)) render(); }); node.addEventListener('click', event => { if(event.target.closest('.sub-field')) return; const field=fields[Number(node.dataset.index)]; if(event.target.dataset.action==='remove'){ fields.splice(Number(node.dataset.index),1); render(); setStatus('字段已删除。'); } if(event.target.dataset.action==='add-child'){ field.subFields.push(defaultField('new_item_field','varchar(255)','',true)); render(); setStatus('已新增一个子档字段。','success'); } }); }); document.querySelectorAll('.sub-field').forEach(node => { node.addEventListener('input', event => { const field=fields[Number(node.dataset.parentIndex)].subFields[Number(node.dataset.childIndex)]; updateField(field,event.target,true); }); node.addEventListener('click', event => { if(event.target.dataset.action==='remove-child'){ fields[Number(node.dataset.parentIndex)].subFields.splice(Number(node.dataset.childIndex),1); render(); setStatus('子档字段已删除。'); } }); }); };
      const isValidField = field => field.name.trim() && field.attr.trim() && field.attrName.trim() && field.scenes.length && (field.fieldType !== 'SUB_ITEM' || field.subFields.every(isValidField));
      const appendYamlField = (lines, field, indent, isChild = false) => { const prefix=' '.repeat(indent); lines.push(`${prefix}- name: ${escapeYaml(field.name)}`,`${prefix}  attr: ${escapeYaml(field.attr)}`,`${prefix}  attrName: ${escapeYaml(field.attrName)}`,`${prefix}  fieldType: ${field.fieldType}`,`${prefix}  scenes: [${field.scenes.join(', ')}]`,`${prefix}  required: ${Boolean(field.required)}`,`${prefix}  editable: ${Boolean(field.editable)}`,`${prefix}  defaultValue: null`,`${prefix}  filterName: ${!isChild && field.filterable && FILTERABLE.has(field.fieldType) ? escapeYaml(field.name) : 'null'}`); if(OPTION_TYPES.has(field.fieldType) && field.extra.trim()) lines.push(`${prefix}  options: ${escapeYaml(field.extra.trim())}`); if(field.fieldType==='BUSINESS' && field.extra.trim()) lines.push(`${prefix}  businessCode: ${escapeYaml(field.extra.trim().toUpperCase())}`); if(field.fieldType==='SUB_ITEM'){ lines.push(`${prefix}  subFields:`); field.subFields.forEach(child=>appendYamlField(lines,child,indent+4,true)); } };
      const buildYaml = () => { const code=$('#businessCode').value.trim().toUpperCase(); if(!/^[A-Z][A-Z0-9_]*$/.test(code)){ setStatus('业务编码必须为大写字母开头，只能包含大写字母、数字和下划线。','error'); return ''; } const active=fields.filter(field=>field.enabled); if(!active.length){ setStatus('至少启用一个字段后才能生成 YAML。','error'); return ''; } if(active.some(field=>!isValidField(field))){ setStatus('每个启用字段及其子档字段都必须填写 name、attr、attrName，并至少勾选一个场景。','error'); return ''; } const lines=[`businessCode: ${code}`,'fields:']; active.forEach(field=>appendYamlField(lines,field,2)); lines.push('listActions:','  top: []','  bottom: []','  row: []'); const yaml=lines.join('\n')+'\n'; $('#yamlOutput').value=yaml; setStatus(`已生成 ${active.length} 个启用字段的 YAML；可直接保存为字段设计文件。`,'success'); return yaml; };
      const addField = () => { fields.push(defaultField()); render(); setStatus('已新增一个手动字段，请补齐字段名、路径和展示名称。','success'); };
      $('#parseButton').addEventListener('click',parseSql); $('#addButton').addEventListener('click',addField); $('#bottomAddButton').addEventListener('click',addField); $('#generateButton').addEventListener('click',buildYaml);
      $('#copyButton').addEventListener('click',async()=>{ const yaml=$('#yamlOutput').value || buildYaml(); if(!yaml) return; try { await navigator.clipboard.writeText(yaml); setStatus('YAML 已复制到剪贴板。','success'); } catch { $('#yamlOutput').focus(); $('#yamlOutput').select(); setStatus('浏览器不允许自动复制，已选中内容，请按 Ctrl/Cmd+C。','error'); } });
      $('#downloadButton').addEventListener('click',()=>{ const yaml=$('#yamlOutput').value || buildYaml(); if(!yaml) return; const blob=new Blob([yaml],{type:'text/yaml;charset=utf-8'}); const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download='field-design.yaml'; link.click(); URL.revokeObjectURL(link.href); setStatus('field-design.yaml 已下载。','success'); });
    })();
  </script>
</body>
</html>
