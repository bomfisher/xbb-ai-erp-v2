  - { name: bank_account_no, attr: main.bankAccountNo, attrName: 银行账号, fieldType: TEXT, scenes: [LIST, CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: bank_account_no }
  - { name: account_holder, attr: main.accountHolder, attrName: 开户名, fieldType: TEXT, scenes: [LIST, CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: null }
  - { name: bank_name, attr: main.bankName, attrName: 开户行, fieldType: TEXT, scenes: [LIST, CREATE, UPDATE], required: false, editable: true, defaultValue: null, filterName: null }
  - { name: account_type, attr: main.accountType, attrName: 账户类型, fieldType: COMB, scenes: [LIST, CREATE, UPDATE], required: true, editable: true, defaultValue: CASH, filterName: account_type, options: 'CASH:现金,BANK:银行账户,OTHER:其他' }
