notes:
  - 采购发票明细与销售发票明细使用同样的主从保存协议。
  - 来源单据行保存到 purchase_invoice_line_source，采购订单和采购入库均可带入明细。
notes:
  - 新建采购发票编号由 PURCHASE_INVOICE 业务编号规则生成并回填。
  - 开票来源支持 PURCHASE_INBOUND、PURCHASE_ORDER、MANUAL；手工来源必须填写 manualReason。
  - 表单分组由后端 formSections 返回，包含基本信息、开票来源和金额汇总。
generate: { admin: true, application: true, domain: true, persistence: true, xml: true }
